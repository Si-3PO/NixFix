<VirtualHost *:80>
    ServerName
    DocumentRoot /webfiles/websites

    ErrorLog ${APACHE_LOG_DIR}/custom_error.log
    CustomLog ${APACHE_LOG_DIR}/custom_access.log combined

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/phpVER-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>